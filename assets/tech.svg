  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.40"/>
  </filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
  </filter>
  <g id="orbs"><circle cx="100" cy="120" r="150" fill="#2DD4BF" opacity="0.5"/><circle cx="560" cy="438" r="170" fill="#6366F1" opacity="0.55"/><circle cx="930" cy="150" r="150" fill="#A78BFA" opacity="0.55"/></g></defs>

<clipPath id="frame"><rect width="1000" height="438" rx="26"/></clipPath>
<g clip-path="url(#frame)">
