<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="72" viewBox="0 0 300 72" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050816"/><stop offset="0.55" stop-color="#0A1028"/><stop offset="1" stop-color="#0B0F24"/>
  </linearGradient>
  <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
  </linearGradient>
  <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.28"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <filter id="blurBg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="blurGlass" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="85"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.40"/>
  </filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
  </filter>
  <g id="orbs"><circle cx="40" cy="36" r="60" fill="#2DD4BF" opacity="0.8"/><circle cx="260" cy="40" r="60" fill="#A78BFA" opacity="0.5"/></g></defs>


<g>
  <clipPath id="gc1"><rect x="6" y="6" width="288" height="60" rx="18"/></clipPath>
  <g clip-path="url(#gc1)">
    <rect x="6" y="6" width="288" height="60" fill="#0B1226"/>
    <use href="#orbs" xlink:href="#orbs" filter="url(#blurGlass)" opacity="0.9"/>
    <rect x="6" y="6" width="288" height="60" fill="url(#glassFill)"/>
    <rect x="6" y="6" width="288" height="60" fill="url(#sheen)"/>
  </g>
  <rect x="6.6" y="6.6" width="286.8" height="58.8" rx="18" fill="none" stroke="url(#glassStroke)" stroke-width="1.2"/>
</g>
<g transform="translate(24,20)" fill="none" stroke="#F1F5F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="4" width="30" height="22" rx="4"/><path d="M1 6l14 10L29 6"/></g>
<text x="66" y="33" fill="#F1F5F9" font-size="15.5" font-weight="700">Email</text>
<text x="66" y="51" fill="#A5B4CB" font-size="12.5">sndpsrinivasan@gmail.com</text>
<path d="M262 30l8 6-8 6" fill="none" stroke="#A5B4CB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>