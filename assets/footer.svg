<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="150" viewBox="0 0 1000 150" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050816"/><stop offset="0.55" stop-color="#0A1028"/><stop offset="1" stop-color="#0B0F24"/>
  </linearGradient>
  <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
  </linearGradient>
  <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.28"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <filter id="blurBg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="blurGlass" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="85"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.40"/>
  </filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
  </filter>
  <g id="orbs"><circle cx="200" cy="150" r="140" fill="#2DD4BF" opacity="0.5"/><circle cx="800" cy="0" r="140" fill="#A78BFA" opacity="0.55"/><circle cx="500" cy="80" r="110" fill="#6366F1" opacity="0.45"/></g></defs>

<clipPath id="frame"><rect width="1000" height="150" rx="26"/></clipPath>
<g clip-path="url(#frame)">
  <rect width="1000" height="150" fill="url(#bg)"/>
  <use href="#orbs" xlink:href="#orbs" filter="url(#blurBg)"/>
  <rect width="1000" height="150" filter="url(#grain)"/>
</g>
<rect x="0.5" y="0.5" width="999" height="149" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

<text x="500.0" y="70" text-anchor="middle" fill="#F1F5F9" font-size="21" font-weight="600" font-style="italic">Building technology that makes healthcare smarter, safer and more accessible.</text>
<rect x="468.0" y="92" width="64" height="3" rx="1.5" fill="url(#accent)"/>
<text x="500.0" y="124" text-anchor="middle" fill="#6B7A93" font-size="13" letter-spacing="2.4">CHENNAI, INDIA</text>
</svg>