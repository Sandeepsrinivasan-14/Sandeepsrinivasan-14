<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="490" height="270" viewBox="0 0 490 270" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050816"/><stop offset="0.55" stop-color="#0A1028"/><stop offset="1" stop-color="#0B0F24"/>
  </linearGradient>
  <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
  </linearGradient>
  <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.28"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2DD4BF"/><stop offset="0.5" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/>
  </linearGradient>
  <filter id="blurBg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="blurGlass" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="85"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.40"/>
  </filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.05"/></feComponentTransfer>
  </filter>
  <g id="orbs"><circle cx="60" cy="40" r="110" fill="#38BDF8" opacity="0.6"/><circle cx="430" cy="250" r="120" fill="#6366F1" opacity="0.55"/></g></defs>


<g filter="url(#shadow)">
  <clipPath id="gc1"><rect x="14" y="14" width="462" height="242" rx="22"/></clipPath>
  <g clip-path="url(#gc1)">
    <rect x="14" y="14" width="462" height="242" fill="#0B1226"/>
    <use href="#orbs" xlink:href="#orbs" filter="url(#blurGlass)" opacity="0.9"/>
    <rect x="14" y="14" width="462" height="242" fill="url(#glassFill)"/>
    <rect x="14" y="14" width="462" height="70" fill="url(#sheen)"/>
  </g>
  <rect x="14.6" y="14.6" width="460.8" height="240.8" rx="22" fill="none" stroke="url(#glassStroke)" stroke-width="1.2"/>
</g>
<defs><linearGradient id="t39118" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#38BDF8" stop-opacity="0.95"/><stop offset="1" stop-color="#1D4ED8" stop-opacity="0.85"/></linearGradient></defs>
<g filter="url(#soft)">
  <rect x="40" y="49" width="50" height="50" rx="13.0" fill="#1D4ED8" opacity="0.55"/>
  <rect x="40" y="42" width="50" height="50" rx="13.0" fill="url(#t39118)"/>
  <rect x="42" y="44" width="46" height="22.5" rx="11.0" fill="#FFFFFF" opacity="0.22"/>
  <rect x="40.5" y="42.5" width="49" height="49" rx="13.0" fill="none" stroke="#FFFFFF" stroke-opacity="0.45"/>
</g>
<g transform="translate(40,42) scale(0.8928571428571429)" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="16"/><path d="M18 22h20M16 28h24M18 34h20M22 16v24M28 12v32M34 16v24"/><rect x="28" y="22" width="6" height="6" fill="#FFFFFF" stroke="none"/></g><text x="106" y="64" fill="#F1F5F9" font-size="20" font-weight="800">EdgeDefectNet</text><text x="106" y="86" fill="#6B7A93" font-size="12.5" font-family="'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', monospace">EdgeDefectNet</text><text x="40" y="134" fill="#A5B4CB" font-size="14.5">Wafer-edge defect classification across 9 classes,</text><text x="40" y="156" fill="#A5B4CB" font-size="14.5">with evaluation metrics, inference scripts and</text><text x="40" y="178" fill="#A5B4CB" font-size="14.5">ONNX export for deployment.</text><g><rect x="40" y="200" width="73.2" height="28" rx="14.0" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.22"/><text x="76.6" y="218.5" text-anchor="middle" fill="#F1F5F9" font-size="12.5" font-weight="500">PyTorch</text></g><g><rect x="121.25" y="200" width="86.8" height="28" rx="14.0" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.22"/><text x="164.6" y="218.5" text-anchor="middle" fill="#F1F5F9" font-size="12.5" font-weight="500">ResNet-18</text></g><g><rect x="216.0" y="200" width="53.0" height="28" rx="14.0" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.22"/><text x="242.5" y="218.5" text-anchor="middle" fill="#F1F5F9" font-size="12.5" font-weight="500">ONNX</text></g><path d="M438 208l7 6-7 6" fill="none" stroke="#6B7A93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>